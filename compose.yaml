services:
  jobpilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: jobpilot:local
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DEBUG: 0
      DATA_DIR: /app/data
      TRACE_DIR: /app/traces
    ports:
      - "127.0.0.1:5055:5000"
    volumes:
      - ./data:/app/data
      - ./traces:/app/traces
    restart: unless-stopped
